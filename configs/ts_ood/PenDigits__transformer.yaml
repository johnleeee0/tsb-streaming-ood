dataset:
  name: ucr
  params:
    data_dir: data/uea
    dataset_name: PenDigits
    archive: UEA
    allow_full_archive_download: true

backbone:
  name: transformer
  params:
    input_dim: auto
    d_model: 128
    nhead: 8
    num_layers: 3  # Paper: "We stack three TST encoder layers"
    dim_feedforward: 256
    dropout: 0.1

ood_methods:
  - name: msp
    params:
      temperature: 1.0
  - name: odin
    params:
      temperature: 1000.0
      epsilon: 0.001
  - name: react
    params:
      percentile: 90
  - name: dice
    params:
      top_k: 20
  - name: gradnorm
    params:
      {}
  - name: mahalanobis
    params:
      {}
  - name: dfm_pca
    params:
      n_components: 32
  - name: outlier_exposure
    params:
      score_type: energy
  - name: divoe
    params:
      {}
  - name: scale
    params:
      {}
  - name: codit
    params:
      n_epochs: 30
      eval_n: 5
  - name: srs
    params:
      period: null
      latent_dim: 32
      n_epochs: 30
  - name: diffad
    params:
      n_steps: 50
      n_epochs: 20
      hidden_dim: 64
  - name: diversify
    params:
      latent_domain_num: 10
      n_epochs: 30
      alpha: 0.1
  - name: invad
    params:
      n_epochs: 30
      hidden_dim: 128
      n_layers: 2
  - name: m2n2
    params:
      n_epochs: 30
      hidden_dim: 64
      gamma: 0.999
  - name: tdivdm
    params:
      bandwidth: scott
      n_samples_kde: 1000
  - name: catsight
    params:
      n_components: 6
      reg: 0.0001
  - name: ae_adwin_lstm
    params:
      n_epochs_ae: 20
      n_epochs_lstm: 20
      hidden_dim: 64
      lstm_layers: 2
      seq_len: 10
      adwin_delta: 0.002
      batch_size: 64
      lr: 0.001
  - name: dimmad
    params:
      class_agg: min
      metric_agg: median

  - name: deedee
    params:
      window_size: 10
      sigma: 1.0
      s: 1.5
      n_estimators: 100
      contamination: 0.1

  - name: diversemix
    params:
      n_epochs: 30
      alpha: 2.0
      temperature: 0.5
      omega: 0.5
      hidden_dim: 128
      lr: 0.001
      batch_size: 64

  - name: driftlens
    params:
      n_components: 150
      n_threshold_samples: 1000
      threshold_sensitivity: 0.01
      window_size: 100

train:
  enabled: true
  epochs: 100
  batch_size: 16
  lr: 0.001
  loss_type: ce
eval:
  plots: true
  embedding_plot: pca

output_dir: results/PenDigits_transformer

seed: 42
