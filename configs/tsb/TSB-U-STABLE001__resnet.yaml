# TSB-StreamingAD-U  ·  STABLE_001  (HumanActivity — same-domain control)
# -----------------------------------------------------------------------
# Source 1 : UCR id_8  HumanActivity (tr=2631, 1st_anomaly=8285)
# Source 2 : UCR id_12 HumanActivity (tr=16250)
# Series   : 10,524 timesteps, 1 channel, ~20% anomaly rate
# Windows  : size=64, stride=32
# Source-1 : ~257 normal windows (rows 0..8284)
#
# STABLE category: both sources are the SAME domain (HumanActivity UCR).
# This is the NEGATIVE CONTROL experiment — if OOD methods correctly
# distinguish anomalous from normal windows, AUROC should still be above
# chance, but the distributional gap between sources is much smaller.
# Expected: lower AUROC than DRIFT datasets (harder OOD problem).
# -----------------------------------------------------------------------

dataset:
  name: tsb
  params:
    dataset_name: TSB-U-STABLE001
    data_path: datasets/TSB-StreamingAD-U/STABLE_001_SEG_10524_310_UCR_id_8_HumanActivity_tr_2631_1st_8285_AND_314_UCR_id_12_HumanActivity_tr_16250_1st_38500.csv
    window_size: 64
    stride: 32
    n_pseudo_classes: 4
    train_frac: 0.70
    val_frac: 0.15
    max_rows: null
    seed: 42
    normalize: per_series
    boundary_split: true

backbone:
  name: resnet
  params:
    input_dim: auto
    base_channels: 64
    embedding_dim: 128

ood_methods:
  - name: msp
    params:
      temperature: 1.0
  - name: odin
    params:
      temperature: 1000.0
      epsilon: 0.001
  - name: react
    params:
      percentile: 90
  - name: dice
    params:
      top_k: 20
  - name: gradnorm
    params:
      {}
  - name: mahalanobis
    params:
      {}
  - name: dfm_pca
    params:
      n_components: 32
  - name: outlier_exposure
    params:
      score_type: energy
  - name: divoe
    params:
      {}
  - name: scale
    params:
      {}
  - name: codit
    params:
      n_epochs: 30
      eval_n: 5
  - name: diffad
    params:
      n_steps: 50
      n_epochs: 20
      hidden_dim: 64
  - name: diversify
    params:
      latent_domain_num: 10
      n_epochs: 30
      alpha: 0.1
  - name: invad
    params:
      n_epochs: 30
      hidden_dim: 128
      n_layers: 2
  - name: m2n2
    params:
      n_epochs: 30
      hidden_dim: 64
      gamma: 0.999
  - name: tdivdm
    params:
      bandwidth: scott
      n_samples_kde: 1000
  - name: catsight
    params:
      n_components: 6
      reg: 0.0001
  - name: ae_adwin_lstm
    params:
      n_epochs_ae: 20
      n_epochs_lstm: 20
      hidden_dim: 64
      lstm_layers: 2
      seq_len: 10
      adwin_delta: 0.002
      batch_size: 64
      lr: 0.001
  - name: dimmad
    params:
      class_agg: min
      metric_agg: median
  - name: deedee
    params:
      n_components: 32
      bandwidth: scott
  - name: diversemix
    params:
      n_epochs: 30
      alpha: 2.0
      temperature: 0.5
      omega: 0.5
      hidden_dim: 128
      lr: 0.001
      batch_size: 64
  - name: driftlens
    params:
      n_components: 50
      n_threshold_samples: 200
      threshold_sensitivity: 0.01
      window_size: 30

train:
  enabled: true
  epochs: 100
  batch_size: 16
  lr: 0.001
  loss_type: ce

eval:
  plots: false
  metrics_only: true

output_dir: results/TSB-U-STABLE001_resnet

seed: 42
