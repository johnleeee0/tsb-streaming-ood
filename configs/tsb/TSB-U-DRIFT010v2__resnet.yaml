# TSB-StreamingAD-U  ·  DRIFT_010  (Facility / Exathlon)  — v2 FIXED
# -----------------------------------------------------------------------
# Source 1 : UCR id_219 Facility (tr=3000, 1st_anomaly=6527)
# Source 2 : Exathlon id_15 Facility
# Series   : 12,000 timesteps, 1 channel, ~9% anomaly
# Windows  : size=64, stride=32
# Source-1 : ~202 normal windows (rows 0..6526)
#
# FIX v2 vs v1:
#   - boundary_split: true  -> training uses ONLY Source-1 windows
#     (v1 used 1077 training windows; ~875 were from Source-2, contaminating
#      the backbone and collapsing AUROC to ~0.5)
#   - normalize: global     -> preserves level-shift signal between sources
#     (v1 used per_series which erased the level difference entirely)
# -----------------------------------------------------------------------

dataset:
  name: tsb
  params:
    dataset_name: TSB-U-DRIFT010v2
    data_path: datasets/TSB-StreamingAD-U/DRIFT_010_SEG_12000_521_UCR_id_219_Facility_tr_3000_1st_6527_AND_824_Exathlon_id_15_Facility_tr_10766_1st_12590.csv
    window_size: 64
    stride: 32
    n_pseudo_classes: 4
    train_frac: 0.70
    val_frac: 0.15
    max_rows: null
    seed: 42
    normalize: global          # fit on Source-1 train, preserves level shift
    boundary_split: true       # use Source-1 only for training

backbone:
  name: resnet
  params:
    input_dim: auto
    base_channels: 64
    embedding_dim: 128

ood_methods:
  - name: msp
    params:
      temperature: 1.0
  - name: odin
    params:
      temperature: 1000.0
      epsilon: 0.001
  - name: react
    params:
      percentile: 90
  - name: dice
    params:
      top_k: 20
  - name: gradnorm
    params:
      {}
  - name: mahalanobis
    params:
      {}
  - name: dfm_pca
    params:
      n_components: 32
  - name: outlier_exposure
    params:
      score_type: energy
  - name: divoe
    params:
      {}
  - name: scale
    params:
      {}
  - name: codit
    params:
      n_epochs: 30
      eval_n: 5
  - name: diffad
    params:
      n_steps: 50
      n_epochs: 20
      hidden_dim: 64
  - name: diversify
    params:
      latent_domain_num: 10
      n_epochs: 30
      alpha: 0.1
  - name: invad
    params:
      n_epochs: 30
      hidden_dim: 128
      n_layers: 2
  - name: m2n2
    params:
      n_epochs: 30
      hidden_dim: 64
      gamma: 0.999
  - name: tdivdm
    params:
      bandwidth: scott
      n_samples_kde: 1000
  - name: catsight
    params:
      n_components: 6
      reg: 0.0001
  - name: ae_adwin_lstm
    params:
      n_epochs_ae: 20
      n_epochs_lstm: 20
      hidden_dim: 64
      lstm_layers: 2
      seq_len: 10
      adwin_delta: 0.002
      batch_size: 64
      lr: 0.001
  - name: dimmad
    params:
      class_agg: min
      metric_agg: median
  # deedee omitted — O(N^2) KDE too slow
  - name: diversemix
    params:
      n_epochs: 30
      alpha: 2.0
      temperature: 0.5
      omega: 0.5
      hidden_dim: 128
      lr: 0.001
      batch_size: 64
  - name: driftlens
    params:
      n_components: 50
      n_threshold_samples: 500
      threshold_sensitivity: 0.01
      window_size: 30

train:
  enabled: true
  epochs: 100
  batch_size: 16
  lr: 0.001
  loss_type: ce

eval:
  plots: false
  metrics_only: true

output_dir: results/TSB-U-DRIFT010v2_resnet

seed: 42
