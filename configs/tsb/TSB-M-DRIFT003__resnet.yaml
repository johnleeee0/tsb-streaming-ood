# TSB-StreamingAD-M  ·  DRIFT_003  (MITDB + SVDB ECG, bivariate)
# ---------------------------------------------------------------
# Source : MIT-BIH Arrhythmia DB (MLII + V4 leads) + SVDB
# Series : 230,400 timesteps, 2 channels (MLII, V4), 8.5% anomaly
# Windows: size=128, stride=64  →  ~3,600 total windows
#          (128 ≈ one cardiac cycle at 360 Hz sampling rate)
# max_rows: 80000 → keeps runtime manageable (~1200 windows)
# OOD    : windows containing ≥1 anomalous timestep (binary label 1)
# Train  : normal windows from first 70% of series (pseudo-classes)
# ---------------------------------------------------------------

dataset:
  name: tsb
  params:
    dataset_name: TSB-M-DRIFT003
    data_path: datasets/TSB-StreamingAD-M/DRIFT_003_SEG_150000_019_MITDB_id_1_Medical_tr_37500_1st_103211_AND_094_SVDB_id_11_Medical_tr_20100_1st_23611.csv
    window_size: 128
    stride: 64
    n_pseudo_classes: 4
    train_frac: 0.70
    val_frac: 0.15
    max_rows: null   # use full 230,400 rows; anomalies start at row 103,211
    seed: 42
    normalize: per_series

backbone:
  name: resnet
  params:
    input_dim: auto
    base_channels: 64
    embedding_dim: 128

ood_methods:
  - name: msp
    params:
      temperature: 1.0
  - name: odin
    params:
      temperature: 1000.0
      epsilon: 0.001
  - name: react
    params:
      percentile: 90
  - name: dice
    params:
      top_k: 20
  - name: gradnorm
    params:
      {}
  - name: mahalanobis
    params:
      {}
  - name: dfm_pca
    params:
      n_components: 32
  - name: outlier_exposure
    params:
      score_type: energy
  - name: divoe
    params:
      {}
  - name: scale
    params:
      {}
  - name: codit
    params:
      n_epochs: 30
      eval_n: 5
  - name: diffad
    params:
      n_steps: 50
      n_epochs: 20
      hidden_dim: 64
  - name: diversify
    params:
      latent_domain_num: 10
      n_epochs: 30
      alpha: 0.1
  - name: invad
    params:
      n_epochs: 30
      hidden_dim: 128
      n_layers: 2
  - name: m2n2
    params:
      n_epochs: 30
      hidden_dim: 64
      gamma: 0.999
  - name: tdivdm
    params:
      bandwidth: scott
      n_samples_kde: 1000
  - name: catsight
    params:
      n_components: 6
      reg: 0.0001
  - name: ae_adwin_lstm
    params:
      n_epochs_ae: 20
      n_epochs_lstm: 20
      hidden_dim: 64
      lstm_layers: 2
      seq_len: 10
      adwin_delta: 0.002
      batch_size: 64
      lr: 0.001
  - name: dimmad
    params:
      class_agg: min
      metric_agg: median
  # deedee omitted — O(N²) KDE scoring is too slow at this dataset size
  - name: diversemix
    params:
      n_epochs: 30
      alpha: 2.0
      temperature: 0.5
      omega: 0.5
      hidden_dim: 128
      lr: 0.001
      batch_size: 64
  - name: driftlens
    params:
      n_components: 100
      n_threshold_samples: 1000
      threshold_sensitivity: 0.01
      window_size: 50

train:
  enabled: true
  epochs: 100
  batch_size: 32
  lr: 0.001
  loss_type: ce

eval:
  plots: false
  metrics_only: true

output_dir: results/TSB-M-DRIFT003_resnet

seed: 42
