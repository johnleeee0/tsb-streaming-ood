# TSB-StreamingAD-U  ·  OOD_009  (Environment + Sensor cross-domain)
# -----------------------------------------------------------------------
# Source 1 : UCR id_202 Environment  (tr=2046, 1st_anomaly=5549)
# Source 2 : SMAP id_6  Sensor       (tr=2160)
# Series   : 8,184 timesteps, 1 channel, ~22% anomaly rate
# Windows  : size=64, stride=32
# Source-1 : ~172 normal windows (rows 0..5548)
#
# OOD category: cross-domain shift (Environment vs Sensor telemetry).
# Expected to be easier than STABLE (stronger distributional gap) and
# comparable to DRIFT datasets.
# boundary_split=true, global normalization preserves amplitude differences
# between the environment and sensor domains.
# -----------------------------------------------------------------------

dataset:
  name: tsb
  params:
    dataset_name: TSB-U-OOD009
    data_path: datasets/TSB-StreamingAD-U/OOD_009_SEG_8184_504_UCR_id_202_Environment_tr_2046_1st_5549_AND_536_SMAP_id_6_Sensor_tr_2160_1st_5600.csv
    window_size: 64
    stride: 32
    n_pseudo_classes: 4
    train_frac: 0.70
    val_frac: 0.15
    max_rows: null
    seed: 42
    normalize: global          # preserves amplitude difference between domains
    boundary_split: true

backbone:
  name: resnet
  params:
    input_dim: auto
    base_channels: 64
    embedding_dim: 128

ood_methods:
  - name: msp
    params:
      temperature: 1.0
  - name: odin
    params:
      temperature: 1000.0
      epsilon: 0.001
  - name: react
    params:
      percentile: 90
  - name: dice
    params:
      top_k: 20
  - name: gradnorm
    params:
      {}
  - name: mahalanobis
    params:
      {}
  - name: dfm_pca
    params:
      n_components: 32
  - name: outlier_exposure
    params:
      score_type: energy
  - name: divoe
    params:
      {}
  - name: scale
    params:
      {}
  - name: codit
    params:
      n_epochs: 30
      eval_n: 5
  - name: diffad
    params:
      n_steps: 50
      n_epochs: 20
      hidden_dim: 64
  - name: diversify
    params:
      latent_domain_num: 10
      n_epochs: 30
      alpha: 0.1
  - name: invad
    params:
      n_epochs: 30
      hidden_dim: 128
      n_layers: 2
  - name: m2n2
    params:
      n_epochs: 30
      hidden_dim: 64
      gamma: 0.999
  - name: tdivdm
    params:
      bandwidth: scott
      n_samples_kde: 1000
  - name: catsight
    params:
      n_components: 6
      reg: 0.0001
  - name: ae_adwin_lstm
    params:
      n_epochs_ae: 20
      n_epochs_lstm: 20
      hidden_dim: 64
      lstm_layers: 2
      seq_len: 10
      adwin_delta: 0.002
      batch_size: 64
      lr: 0.001
  - name: dimmad
    params:
      class_agg: min
      metric_agg: median
  # deedee omitted — O(N^2) too slow
  - name: diversemix
    params:
      n_epochs: 30
      alpha: 2.0
      temperature: 0.5
      omega: 0.5
      hidden_dim: 128
      lr: 0.001
      batch_size: 64
  - name: driftlens
    params:
      n_components: 50
      n_threshold_samples: 200
      threshold_sensitivity: 0.01
      window_size: 30

train:
  enabled: true
  epochs: 100
  batch_size: 16
  lr: 0.001
  loss_type: ce

eval:
  plots: false
  metrics_only: true

output_dir: results/TSB-U-OOD009_resnet

seed: 42
